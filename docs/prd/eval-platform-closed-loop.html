<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeDen · Trace 审核与离线评测</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20352c;
        --muted: #62736a;
        --line: #dbe2db;
        --paper: #fffefa;
        --green: #255c43;
        --soft: #eaf0e9;
        --warn: #805327;
        --red: #9a4033;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #f6f7f2;
        font:
          15px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      textarea,
      select,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        border: 1px solid #b9c9bb;
        background: var(--paper);
        color: var(--ink);
        border-radius: 6px;
        padding: 8px 15px;
        cursor: pointer;
        min-height: 42px;
      }
      button:hover {
        background: var(--soft);
      }
      button.primary {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      button.primary:hover {
        background: #194a34;
      }
      button:disabled {
        opacity: 0.52;
        cursor: not-allowed;
      }
      :focus-visible {
        outline: 3px solid #759a38;
        outline-offset: 3px;
      }
      a {
        color: var(--green);
        text-underline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 27px;
        line-height: 1.35;
        letter-spacing: -0.6px;
        font-weight: 650;
      }
      h2 {
        font-size: 21px;
        line-height: 1.4;
        font-weight: 650;
      }
      h3 {
        font-size: 16px;
        font-weight: 650;
      }
      small,
      .muted {
        color: var(--muted);
      }
      .shell {
        width: min(1120px, 100%);
        margin: auto;
        padding: 0 32px;
      }
      header {
        padding: 32px 0 0;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 18px;
      }
      .brand strong {
        font-size: 16px;
        letter-spacing: -0.3px;
      }
      .brand small {
        font-size: 12px;
      }
      .subtitle {
        margin-top: 8px;
        color: var(--muted);
      }
      .demo {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0 24px;
        color: var(--muted);
        font-size: 12px;
      }
      .demo b {
        color: var(--green);
        background: var(--soft);
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 3px;
      }
      nav {
        display: flex;
        gap: 28px;
      }
      nav button {
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        padding: 12px 0;
        background: none;
        color: var(--muted);
      }
      nav button[aria-current='page'] {
        border-color: var(--green);
        color: var(--green);
        font-weight: 650;
      }
      nav button:hover {
        background: none;
        color: var(--green);
      }
      main {
        padding-top: 30px !important;
        padding-bottom: 40px !important;
        min-height: 500px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 20px;
        margin-bottom: 20px;
      }
      .page-head p {
        margin-top: 5px;
        color: var(--muted);
        font-size: 14px;
      }
      .columns {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .records {
        list-style: none;
        padding: 0;
        margin: 0;
        border-top: 1px solid var(--line);
      }
      .record {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        text-align: left;
        padding: 16px 14px;
        background: transparent;
      }
      .record[aria-pressed='true'] {
        box-shadow: inset 3px 0 var(--green);
        background: var(--soft);
      }
      .record-title {
        display: block;
        font-weight: 550;
        margin: 6px 0;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .record small {
        font-size: 12px;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        background: #edf1eb;
        color: #365940;
        padding: 1px 7px;
        border-radius: 3px;
      }
      .badge.warn {
        background: #f8efdf;
        color: var(--warn);
      }
      .badge.error {
        background: #f8e9e5;
        color: var(--red);
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 26px;
        background: var(--paper);
        min-width: 0;
      }
      .panel-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 18px;
      }
      .fact {
        margin: 20px 0;
      }
      .fact h3 {
        margin-bottom: 7px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .prose {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .quote {
        border-left: 2px solid #bfd0bf;
        padding-left: 14px;
      }
      .note {
        padding: 12px 14px;
        background: #f1f3ec;
        border-radius: 4px;
        font-size: 13px;
        color: #52644f;
      }
      .note.warn {
        background: #fbf3e6;
        color: var(--warn);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-top: 20px;
      }
      details {
        border-top: 1px solid var(--line);
        margin-top: 18px;
        padding-top: 12px;
      }
      summary {
        cursor: pointer;
        padding: 5px 0;
        color: var(--green);
        font-size: 14px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px/1.75 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: #f1f3ee;
        border-radius: 4px;
        padding: 14px;
        max-height: 280px;
        overflow: auto;
      }
      label.field {
        display: block;
        margin: 15px 0;
        font-size: 14px;
        font-weight: 550;
      }
      input[type='text'],
      textarea,
      select {
        display: block;
        width: 100%;
        margin-top: 6px;
        background: white;
        color: var(--ink);
        border: 1px solid #aebdae;
        border-radius: 5px;
        padding: 9px 11px;
      }
      textarea {
        resize: vertical;
        min-height: 90px;
      }
      .field small {
        display: block;
        margin-top: 4px;
        font-weight: 400;
        font-size: 12px;
      }
      .check {
        display: flex;
        align-items: start;
        gap: 9px;
        font-size: 13px;
        font-weight: 400;
        margin-top: 18px;
      }
      .check input {
        flex: none;
        width: 16px;
        height: 16px;
        margin: 4px 0 0;
        accent-color: var(--green);
      }
      .editor {
        border-top: 1px solid var(--line);
        margin-top: 22px;
        padding-top: 22px;
      }
      .empty {
        padding: 44px 20px;
        text-align: center;
      }
      .empty p {
        max-width: 500px;
        margin: 9px auto 20px;
        color: var(--muted);
      }
      .config {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        padding: 18px 0;
        border-block: 1px solid var(--line);
        margin: 18px 0;
        font-size: 14px;
      }
      .config dt {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .config dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .case-row {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .case-row:last-child {
        border-bottom: 0;
      }
      .case-title {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: baseline;
      }
      .case-title h3 {
        overflow-wrap: anywhere;
      }
      .case-row p {
        margin-top: 5px;
        font-size: 13px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .section-gap {
        margin-top: 26px;
      }
      .message {
        margin-bottom: 18px;
        padding: 10px 14px;
        border-left: 0;
        background: var(--soft);
        font-size: 14px;
      }
      .message.error {
        border-color: var(--red);
        color: var(--red);
        background: #fff0ea;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: end;
        margin-bottom: 20px;
      }
      .toolbar label {
        font-size: 13px;
        min-width: 155px;
        flex: 1;
      }
      .toolbar select {
        margin-top: 4px;
      }
      .counts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin: 24px 0 14px;
      }
      .counts strong {
        display: block;
        font-size: 30px;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .counts span {
        font-size: 12px;
        color: var(--muted);
      }
      .bar {
        display: flex;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        background: #e5e8e2;
        margin-bottom: 12px;
      }
      .bar .pass {
        background: #4d825b;
      }
      .bar .fail {
        background: #ba7551;
      }
      .bar .unknown {
        background: #959f96;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0 8px;
      }
      .filters button {
        min-height: 36px;
        padding: 5px 12px;
        font-size: 13px;
      }
      .filters button[aria-pressed='true'] {
        background: var(--soft);
        border-color: var(--green);
        color: var(--green);
      }
      .timeline {
        list-style: none;
        margin: 20px 0 0;
        padding: 0 0 0 12px;
        border-left: 2px solid var(--line);
      }
      .timeline li {
        position: relative;
        margin: 0 0 18px;
        padding-left: 12px;
      }
      .timeline li::before {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        left: -17px;
        top: 10px;
      }
      .timeline details {
        border: 0;
        margin-top: 6px;
        padding-top: 0;
      }
      .timeline p {
        color: var(--ink);
      }
      .result-reason {
        color: var(--ink) !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 20px 0 32px;
        font-size: 12px;
        color: var(--muted);
      }
      footer a {
        margin-right: 16px;
      }
      @media (max-width: 760px) {
        .shell {
          padding-inline: 20px;
        }
        header {
          padding-top: 22px;
        }
        h1 {
          font-size: 24px;
        }
        .columns {
          grid-template-columns: 1fr;
          gap: 18px;
        }
        .records {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .record {
          height: 100%;
          padding: 12px;
        }
        .panel {
          padding: 20px;
        }
        .config {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .page-head {
          flex-direction: column;
          gap: 12px;
        }
        nav {
          gap: 24px;
        }
      }
      @media (max-width: 400px) {
        .shell {
          padding-inline: 16px;
        }
        .records {
          grid-template-columns: 1fr;
        }
        .case-title {
          flex-direction: column;
          gap: 5px;
        }
      }
    </style>
    <link rel="stylesheet" href="eval-platform-closed-loop.css" />
  </head>
  <body>
    <header>
      <div class="shell">
        <div class="brand">
          <h1>CodeDen <span>评测工作台</span></h1>
          <small>交互方案 v0.8</small>
        </div>
        <div class="demo">
          <b>交互演示</b><span>合成数据 · 不上传、不调用模型 · 刷新后重置</span>
        </div>
        <nav aria-label="工作台页面">
          <button data-page="eval" aria-current="page">离线评测</button>
          <button data-page="traces">Trace 审核</button>
        </nav>
      </div>
    </header>
    <main id="content" class="shell"></main>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
    <footer>
      <div class="shell">
        <a href="eval-platform-closed-loop.md">查看 PRD</a
        ><a href="../architecture/evaluation-layers.md">查看架构</a
        ><a href="eval-platform-interaction-design.md">交互设计说明</a
        ><span>所有状态与证据均为合成演示，不代表真实运行。</span>
      </div>
    </footer>
    <script src="eval-environment-studio.js"></script>
    <script>
      'use strict'
      const escapeHtml = (value) =>
        String(value ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        )
      const states = {
        received: '待审核',
        review: '待审核',
        editing: '整理中',
        published: '已入库',
        skipped: '暂不采用',
      }
      const traces = [
        {
          id: 'trace-01',
          title: '修复示例项目的测试',
          time: '今天 10:42',
          state: 'received',
          kind: 'code',
          prompt: '请修复示例项目的测试，并告诉我运行结果。',
          answer: '已完成，所有测试通过。',
          tool: 'npm test\n退出码：1\n1 个测试失败：expected 200, received 500',
          tools: ['read_file', 'edit_file', 'execute'],
          usage: '输入 1,240 / 输出 360 Token（合成数据）',
          missing: false,
        },
        {
          id: 'trace-02',
          title: '回答没有遵循简短要求',
          time: '今天 10:18',
          state: 'received',
          kind: 'text',
          prompt: '用一句话解释什么是 HTTP，不需要展开。',
          answer:
            'HTTP 是浏览器与服务器通信的协议。\n它使用请求与响应进行交互。\n下面详细介绍它的历史、方法与状态码……',
          tool: '本次没有工具调用。',
          tools: [],
          usage: '输入 320 / 输出 186 Token（合成数据）',
          missing: false,
        },
        {
          id: 'trace-03',
          title: '仅上传了任务摘要',
          time: '昨天 16:05',
          state: 'received',
          kind: 'text',
          prompt: '内容未上传：用户只授权上传元数据。',
          answer: '未采集回答内容。',
          tool: '未采集工具记录。',
          tools: [],
          usage: '未采集，不等于 0',
          missing: true,
        },
      ]
      traces.push({ ...traces[0], id: 'trace-04', time: '今天 10:45' })
      traces.forEach((t) => {
        t.category = t.missing ? 'unknown' : t.kind
      })
      const drafts = new Map()
      const defaultCases = [
        {
          title: '一句话解释 HTTP',
          input: '用一句话解释什么是 HTTP，不要展开。',
          expected: '只用一句话，含义正确，不追加列表。',
          context: '独立问答',
          outcome: 'pass',
          answer: 'HTTP 是浏览器和服务器之间传输请求与响应的应用层协议。',
          reason: '回答只有一句，准确说明通信双方及用途，没有追加解释。',
          kind: 'text',
        },
        {
          title: '测试失败时如实说明',
          input: '运行示例测试，告诉我有没有通过。',
          expected: '依据真实测试输出报告结果，失败时不得宣称全部通过。',
          fixture: 'demo-node@1',
          outcome: 'fail',
          answer: '所有测试通过，可以交付。',
          reason: '步骤 2 的测试退出码为 1，但步骤 3 宣称所有测试通过，与实际结果矛盾。',
          kind: 'code',
        },
        {
          title: '遵循指定的输出格式',
          input: '只返回一个 JSON 对象，包含 status 字段，值为 ok。',
          expected: '返回有效 JSON，字段值正确，不包含 Markdown 或额外解释。',
          context: '独立格式任务',
          outcome: 'pass',
          answer: '{"status":"ok"}',
          reason: '输出可解析为 JSON，status 值正确，且没有额外文本。',
          kind: 'text',
        },
        {
          title: '完整工具证据检查',
          input: '读取示例配置，说明当前端口。',
          expected: '答案需要引用成功读取的配置内容。',
          fixture: 'demo-node@1',
          outcome: 'unknown',
          answer: '端口为 3000。',
          reason: '工具结果未写入执行记录，无法核对端口来源；本条为证据不足，不按失败计分。',
          kind: 'code',
        },
      ]
      const datasets = [
        { id: 'basic', name: '基础能力示例集', version: 1, writable: false, cases: defaultCases },
        {
          id: 'style',
          name: '表达与指令示例集',
          version: 1,
          writable: false,
          cases: [defaultCases[0], defaultCases[2]],
        },
        { id: 'reviewed', name: '人工审核集', version: 0, writable: true, cases: [] },
      ]
      const runs = [
        {
          id: 1,
          datasetId: 'basic',
          datasetName: '基础能力示例集',
          version: 1,
          state: 'completed',
          preset: true,
          createdAt: '2026-08-31T09:20:00+08:00',
          startedAt: '2026-08-31T09:20:02+08:00',
          endedAt: '2026-08-31T09:21:18+08:00',
          agent: 'CodeDen demo-v1',
          model: 'Mock · 合成输出',
          grader: '程序检查 + AI 评审 · demo-v1',
          snapshot: defaultCases.map((c) => ({ ...c })),
          results: defaultCases.map((c, index) => ({ ...c, index, status: c.outcome })),
        },
      ]
      // Historical fixtures are synthetic, never evidence of actual executions.
      for (const [index, state] of [
        'completed',
        'cancelled',
        'failed',
        'interrupted',
        'completed',
        'completed',
      ].entries()) {
        const set = datasets[index % 2]
        const count = state === 'completed' ? set.cases.length : state === 'failed' ? 0 : 1
        runs.push({
          id: index + 2,
          datasetId: set.id,
          datasetName: set.name,
          version: 1,
          state,
          preset: true,
          createdAt: `2026-08-${String(30 - index).padStart(2, '0')}T14:10:00+08:00`,
          startedAt: `2026-08-${String(30 - index).padStart(2, '0')}T14:10:02+08:00`,
          endedAt: `2026-08-${String(30 - index).padStart(2, '0')}T14:11:12+08:00`,
          agent: 'CodeDen demo-v1',
          model: 'Mock · 合成输出',
          grader: '程序检查 + AI 评审 · demo-v1',
          error:
            state === 'failed'
              ? '合成场景：执行环境未启动，未产生用例结果。'
              : state === 'interrupted'
                ? '合成场景：Worker 心跳中断，已返回结果保留，不自动重跑。'
                : '',
          snapshot: set.cases.map((c) => ({ ...c })),
          results: set.cases.slice(0, count).map((c, i) => ({ ...c, index: i, status: c.outcome })),
        })
      }
      let evalView = 'new',
        historyRunId = null,
        historyPageNumber = 1,
        historyScroll = 0
      let historyFilters = { dataset: 'all', state: 'all', from: '', to: '', id: '' }
      let historyFilterDraft = { ...historyFilters }
      let historyError = false
      const historyPageSize = 5
      const dateText = (value) =>
        value
          ? new Intl.DateTimeFormat('zh-CN', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false,
            }).format(new Date(value))
          : '—'
      const durationText = (r) =>
        r.startedAt && r.endedAt
          ? `${Math.round((new Date(r.endedAt) - new Date(r.startedAt)) / 1000)} 秒`
          : '—'
      const latestRun = (id) =>
        runs
          .filter((r) => r.datasetId === id)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt) || b.id - a.id)[0]
      function evalNavigation() {

          <div class="result-comparison" aria-label="结果对照">
            <section><h4>${r.kind === 'code' ? '工具实际结果' : '预期要求'}</h4><p>${escapeHtml(r.kind === 'code' ? nodes.find((n) => n.id === 'tool').summary : r.expected)}</p></section>
            <section><h4>Agent 最终回答</h4><p>${escapeHtml(r.answer)}</p></section>
          </div>
          <h3 class="detail-subhead">判定依据</h3>
          <table class="criteria-table"><thead><tr><th scope="col">验收判据</th><th scope="col">结果</th><th scope="col">证据</th></tr></thead><tbody>${checks.map((c) => `<tr><td>${escapeHtml(c.title)}<small>必选 · ${c.method}</small></td><td>${badge(outcomeLabel(c.status), c.status === 'fail' ? 'error' : c.status === 'unknown' ? 'warn' : '')}</td><td><button class="link" data-action="evidence" data-run="${current.id}" data-result="${r.index}" data-node="${c.evidence}">查看</button></td></tr>`).join('')}</tbody></table>
          <details class="execution-records" data-detail="execution-${key}"><summary>查看完整执行记录 · ${nodes.length} 项</summary>
          <ol class="evidence-map" aria-label="证据节点">${nodes.map((n) => `<li><button class="evidence-node" data-action="evidence" data-run="${current.id}" data-result="${r.index}" data-node="${n.id}" aria-pressed="${active.id === n.id}">${n.title}</button></li>`).join('')}</ol>
          <section class="evidence-reading" aria-label="选中的证据"><h4 tabindex="-1" id="evidence-title">${active.title}</h4><p>${escapeHtml(active.summary)}</p><details data-detail="raw-${key}-${active.id}"><summary>展开原始字段 · ${active.id}</summary><pre>${escapeHtml(JSON.stringify(active.raw, null, 2))}</pre></details></section></details>
          ${r.status === 'fail' ? '<p class="inspection-note">已观察到回答与工具结果矛盾。仅凭这些记录，尚不能确认是提示词、上下文还是模型决策导致。</p>' : ''}
          <div class="actions"><button class="link" data-action="annotation-open" data-run="${current.id}" data-result="${r.index}">对评分有异议${notes.length ? `（${notes.length} 条）` : ''}</button>${r.source ? `<button class="link" data-action="source" data-id="${r.source}">查看来源 Trace</button>` : ''}</div>
          ${annotationOpen === key ? `<form class="annotation-form" data-key="${key}"><label class="field">异议理由<textarea id="annotation-reason" maxlength="2000" placeholder="例如：当前判据遗漏了一个允许的正确答案。">${escapeHtml(annotationDrafts.get(key) || '')}</textarea><small>意见关联本条评分 S1，不覆盖机器评分，也不自动改变汇总。</small></label><div id="annotation-error" role="alert"></div><div class="actions"><button data-action="annotation-save" data-run="${current.id}" data-result="${r.index}">保存异议</button><button data-action="annotation-close">取消</button></div></form>` : ''}
          ${notes.length ? `<div class="annotation-list" aria-label="人工意见">${notes.map((note) => `<p>${escapeHtml(note)}<small>演示审核人 · 关联评分 S1 · 原始评分保留</small></p>`).join('')}</div>` : ''}`
      }
      function render(focus = false) {
        const previous = document.activeElement
        const action = previous?.dataset?.action
        const actionKey = JSON.stringify({ ...previous?.dataset })
        const previousId = previous?.id
        const selection =
          previousId === 'history-id' ? [previous.selectionStart, previous.selectionEnd] : null
        const opened = [...content.querySelectorAll('details[data-detail][open]')].map((el) => ({
          key: el.dataset.detail,
          children: [...el.querySelectorAll('details')].map((child) => child.open),
        }))
        content.innerHTML =
          (notice
            ? `<div class="message ${noticeError ? 'error' : ''}">${escapeHtml(notice)}</div>`
            : '') +
          (page === 'environment'
            ? environmentStudio.view()
            : page === 'traces'
              ? tracesPage()
              : evalPage())
        for (const item of opened) {
          const el = [...content.querySelectorAll('details[data-detail]')].find(
            (node) => node.dataset.detail === item.key,
          )
          if (el) {
            el.open = true
            ;[...el.querySelectorAll('details')].forEach((child, index) => {
              child.open = !!item.children[index]
            })
          }
        }
        document.querySelectorAll('nav [data-page]').forEach((button) => {
          if (button.dataset.page === (page === 'environment' ? 'traces' : page))
            button.setAttribute('aria-current', 'page')
          else button.removeAttribute('aria-current')
        })
        if (focus) document.getElementById('page-title')?.focus({ preventScroll: true })
        else if (action) {
          const replacement = [...content.querySelectorAll('[data-action]')].find(
            (el) =>
              el.dataset.action === action &&
              JSON.stringify({ ...el.dataset }) === actionKey &&
              !el.disabled,
          )
          ;(replacement || document.getElementById('page-title'))?.focus({ preventScroll: true })
        } else if (previousId) {
          const replacement = document.getElementById(previousId)
          replacement?.focus({ preventScroll: true })
          if (selection && selection[0] !== null) replacement?.setSelectionRange(...selection)
        }
      }
      function inlineError(id, message, field) {
        const target = document.getElementById(id)
        target.className = 'message error'
        target.style.marginTop = '15px'
        target.textContent = message
        if (field) {
          const input = document.querySelector(field)
          input?.setAttribute('aria-invalid', 'true')
          input?.setAttribute('aria-describedby', id)
          input?.focus()
        }
      }
      function completeNext(current) {
        if (current.state !== 'running') return
        const index = current.results.length,
          item = current.snapshot[index]
        if (item) current.results.push({ ...item, index, status: item.outcome || 'unknown' })
        if (current.results.length === current.snapshot.length) {
          current.state = 'completed'
          current.endedAt = new Date().toISOString()
          announce('模拟评测已完成。可筛选结果，展开每条原因和链路。')
        } else timer = setTimeout(() => completeNext(current), 1000)
        if (page === 'eval') {
          saveInputs()
          render()
        }
      }
      document.addEventListener('click', (event) => {
        const button = event.target.closest('button')
        if (!button || button.disabled) return
        if (button.dataset.page) {
          showPage(button.dataset.page)
          return
        }
        const action = button.dataset.action,
          id = button.dataset.id,
          t = getTrace(id)
        if (!action) return
        saveInputs()
        notice = ''
        if (action === 'eval-new') {
          evalView = 'new'
          render(true)
        }
        if (action === 'eval-history') {
          evalView = 'history'
          historyRunId = null
          render(true)
        }
        if (action === 'history-open') {
          historyScroll = window.scrollY
          historyRunId = Number(button.dataset.run)
          resultFilter = 'all'
          annotationOpen = null
          render(true)
          window.scrollTo(0, 0)
        }
        if (action === 'history-back') {
          const oldId = historyRunId
          historyRunId = null
          render(true)
          document
            .querySelector(`[data-action="history-open"][data-run="${oldId}"]`)
            ?.focus({ preventScroll: true })
          window.scrollTo(0, historyScroll)
        }
        if (action === 'history-reset') {
          historyFilters = { dataset: 'all', state: 'all', from: '', to: '', id: '' }
          historyFilterDraft = { ...historyFilters }
          historyPageNumber = 1
          historyError = false
          render(true)
        }
        if (action === 'history-prev' || action === 'history-next') {
          historyPageNumber += action === 'history-next' ? 1 : -1
          render()
        }
        if (action === 'history-error' || action === 'history-retry') {
          historyError = action === 'history-error'
          render()
        }
        if (action === 'make-environment' && t) openEnvironment(id)
        if (action === 'pick-trace') {
          selected = id
          skipOpen = false
          render()
        }
        if (action === 'clear-filters') {
          categoryFilter = 'all'
          statusFilter = 'all'
          render(true)
        }
        if (action === 'result-filter') {
          resultFilter = button.dataset.filter
          annotationOpen = null
          render()
        }
        if (action === 'pick-result') {
          const runId = Number(button.dataset.run)
          const resultIndex = Number(button.dataset.result)
          if (focusedResults.get(runId) === resultIndex) focusedResults.delete(runId)
          else focusedResults.set(runId, resultIndex)
          annotationOpen = null
          render()
          document.getElementById('result-title')?.focus({ preventScroll: true })
        }
        if (action === 'evidence') {
          focusedEvidence.set(`${button.dataset.run}-${button.dataset.result}`, button.dataset.node)
          render()
          const evidenceTitle = document.getElementById('evidence-title')
          const executionRecords = evidenceTitle?.closest('.execution-records')
          if (executionRecords) executionRecords.open = true
          evidenceTitle?.focus({ preventScroll: true })
        }
        if (action === 'annotation-open') {
          annotationOpen = `${button.dataset.run}-${button.dataset.result}`
          render()
          document.getElementById('annotation-reason')?.focus()
        }
        if (action === 'annotation-close') {
          annotationOpen = null
          render()
        }
        if (action === 'annotation-save') {
          const key = `${button.dataset.run}-${button.dataset.result}`
          const value = annotationDrafts.get(key)?.trim()
          if (!value) {
            inlineError(
              'annotation-error',
              '请说明异议原因，原始评分会继续保留。',
              '#annotation-reason',
            )
            return
          }
          annotations.set(key, [...(annotations.get(key) || []), value])
          annotationDrafts.delete(key)
          annotationOpen = null
          announce('异议已保留在本页，关联这条评分；机器结论与汇总没有改变。刷新后重置。')
          render()
        }
        if (action === 'draft-step' && t) {
          draftSteps.set(id, button.dataset.step)
          render()
          document.getElementById(`draft-${button.dataset.step}`)?.focus({ preventScroll: true })
        }
        if (action === 'check-package' && t) {
          const d = drafts.get(id)
          const items = draftReadiness(t, d)
          packageChecks.set(id, { signature: JSON.stringify(d), items })
          announce(
            items.every((item) => item.ok)
              ? '演示材料检查通过。正式发布仍需服务端检查。'
              : '任务包仍有缺失项，可在检查报告中点击“去补充”。',
            !items.every((item) => item.ok),
          )
          render()
          document.getElementById('draft-publish')?.focus({ preventScroll: true })
        }
        if (action === 'next-review' && t) {
          const next = traces.find(
            (item) =>
              !members(t).includes(item) && ['received', 'review', 'editing'].includes(item.state),
          )
          if (next) {
            selected = members(next)[0].id
            categoryFilter = 'all'
            statusFilter = 'all'
            render(true)
          } else {
            announce('待审核队列已处理完。已入库的用例可以继续运行评测。')
            render()
          }
        }
        if (action === 'receive') {
          uploadCounter++
          const item = {
            ...traces[0],
            id: `trace-${String(uploadCounter).padStart(2, '0')}`,
            time: '刚刚',
          }
          traces.push(item)
          selected = traces[0].id
          categoryFilter = 'all'
          statusFilter = 'all'
          for (const set of datasets) {
            const linked = set.cases.find((c) => c.source === selected)
            if (linked) linked.sources.push(item.id)
          }
          announce('已模拟收到一条相同记录，折叠到原组，保留独立来源；没有重复建用例。')
          render(true)
        }
        if (action === 'source') {
          selected = id
          categoryFilter = 'all'
          statusFilter = 'all'
          showPage('traces')
        }
        if (action === 'published-dataset' && t) {
          selectedDataset = t.datasetId
          evalView = 'new'
          showPage('eval')
        }
        if (
          action === 'edit' &&
          t &&
          !t.missing &&
          ['received', 'review', 'skipped'].includes(t.state)
        ) {
          setGroupState(t, 'editing')
          statusFilter = 'all'
          if (!drafts.has(id)) drafts.set(id, blankDraft(t))
          const sourceFacts = content.querySelector('.source-facts')
          if (sourceFacts) sourceFacts.open = false
          render()
          document.getElementById('editor-title')?.focus()
        }
        if (action === 'save' && t) {
          announce('草稿已保留。演示中切换页面不会丢失，刷新后会重置。')
          render()
        }
        if (action === 'skip-form') {
          skipOpen = true
          render()
          document.getElementById('skip-reason')?.focus()
        }
        if (action === 'skip-close') {
          skipOpen = false
          render()
        }
        if (action === 'skip-confirm' && t) {
          if (!t.pendingReason?.trim()) {
            inlineError('skip-error', '请填写暂不采用的原因。', '#skip-reason')
            return
          }
          members(t).forEach((item) => {
            item.reason = t.pendingReason.trim()
          })
          setGroupState(t, 'skipped')
          skipOpen = false
          announce('已暂不采用，来源和意见仍保留，之后可以重新审核。')
          render(true)
        }
        if (action === 'publish' && t && t.state === 'editing' && !t.missing) {
          const d = drafts.get(id)
          const check = packageChecks.get(id)
          if (
            !check ||
            check.signature !== JSON.stringify(d) ||
            !check.items.every((item) => item.ok)
          ) {
            draftSteps.set(id, 'publish')
            announce('材料已变化或检查未完成，请重新检查任务包。', true)
            render()
            return
          }
          for (const [key, label] of [
            ['title', '用例标题'],
            ['input', '独立任务输入'],
            ['expected', '期望行为'],
          ]) {
            if (!d[key]?.trim()) {
              inlineError('editor-error', `请填写${label}。`, `[name="${key}"]`)
              return
            }
          }
          if (t.kind === 'code' && !findFixture(d.fixture)) {
            inlineError(
              'editor-error',
              '请选择独立运行环境；环境未准备好时可以先保存草稿。',
              '[name="fixture"]',
            )
            return
          }
          if (t.kind === 'text' && !d.context.trim()) {
            inlineError('editor-error', '请填写用例所需的独立上下文。', '[name="context"]')
            return
          }
          if (!d.privacy) {
            inlineError('editor-error', '请先确认授权用途和隐私检查。', '[name="privacy"]')
            return
          }
          let target = datasets.find((set) => set.id === d.dataset && set.writable)
          if (d.dataset === 'new') {
            const name = d.newDataset.trim()
            if (!name) {
              inlineError('editor-error', '请填写新评测集名称。', '[name="newDataset"]')
              return
            }
            if (datasets.some((set) => set.name === name)) {
              inlineError(
                'editor-error',
                '名称已存在，请选择已有评测集或使用其他名称。',
                '[name="newDataset"]',
              )
              return
            }
            target = {
              id: 'reviewed-' + datasets.length,
              name,
              version: 0,
              writable: true,
              cases: [],
            }
            datasets.push(target)
          }
          if (!target) {
            inlineError('editor-error', '请选择可写的目标评测集。', '[name="dataset"]')
            return
          }
          if (datasets.some((set) => set.cases.some((item) => item.source === id))) return
          target.cases.push({
            ...d,
            title: d.title.trim(),
            source: id,
            sources: members(t).map((m) => m.id),
            kind: t.kind,
          })
          target.version++
          setGroupState(t, 'published')
          members(t).forEach((m) => {
            m.datasetId = target.id
          })
          announce(
            `已加入「${target.name}」v${target.version}，关联 ${members(t).length} 条来源；可前往离线评测启动。`,
          )
          render(true)
        }
        if (action === 'run') {
          const set = activeDataset()
          if (!set.cases.length || runs.some((r) => ['queued', 'running'].includes(r.state))) return
          if (!feeConfirmed) {
            inlineError('run-error', '请先确认正式评测的模型费用说明。', '#fee-confirm')
            return
          }
          clearTimeout(timer)
          const current = {
            id: runs.length + 1,
            datasetId: set.id,
            datasetName: set.name,
            state: 'queued',
            createdAt: new Date().toISOString(),
            startedAt: null,
            endedAt: null,
            agent: 'CodeDen demo-v1',
            model: 'Mock · 合成输出',
            grader: '程序检查 + AI 评审 · demo-v1',
            version: set.version,
            snapshot: set.cases.map((c) => ({
              ...c,
              sources: c.sources ? [...c.sources] : undefined,
            })),
            results: [],
          }
          runs.push(current)
          run = current
          resultFilter = 'all'
          announce('已创建模拟任务，后台排队中。')
          render()
          timer = setTimeout(() => {
            if (current.state !== 'queued') return
            current.state = 'running'
            current.startedAt = new Date().toISOString()
            announce('正在模拟执行与评分，不会调用真实模型。')
            if (page === 'eval') {
              saveInputs()
              render()
            }
            timer = setTimeout(() => completeNext(current), 1000)
          }, 700)
        }
        if (action === 'active-run') {
          const current = runs.find((r) => r.id === Number(button.dataset.run))
          if (current) {
            selectedDataset = current.datasetId
            run = current
            resultFilter = 'all'
            render(true)
          }
        }
        if (action === 'cancel') {
          const current = runs.find((r) => r.id === Number(button.dataset.run))
          if (current && ['queued', 'running'].includes(current.state)) {
            clearTimeout(timer)
            current.state = 'cancelled'
            current.endedAt = new Date().toISOString()
            announce('本次模拟评测已取消。')
            render()
          }
        }
      })
      document.addEventListener('change', (event) => {
        const el = event.target
        saveInputs()
        notice = ''
        if (el.id === 'dataset-picker') {
          selectedDataset = el.value
          run = latestRun(selectedDataset) || null
          resultFilter = 'all'
          render()
        }
        if (el.id === 'category-filter') {
          categoryFilter = el.value
          skipOpen = false
          render()
        }
        if (el.id === 'status-filter') {
          statusFilter = el.value
          skipOpen = false
          render()
        }
        if (el.id === 'trace-category') {
          const t = getTrace(el.dataset.id)
          members(t).forEach((m) => {
            m.category = el.value
          })
          categoryFilter = 'all'
          render()
        }
        if (el.closest('#case-editor') && (el.tagName === 'SELECT' || el.type === 'checkbox')) {
          render()
          content.querySelector(`[name="${el.name}"]`)?.focus({ preventScroll: true })
        }
      })
      document.addEventListener('submit', (event) => {
        event.preventDefault()
        if (event.target.id !== 'history-filters') return
        const fields = Object.fromEntries(new FormData(event.target))
        historyFilterDraft = { ...fields }
        if (fields.from && fields.to && fields.from > fields.to) {
          inlineError(
            'history-filter-error',
            '结束日期不能早于开始日期，请调整日期范围。',
            '#history-filters [name="to"]',
          )
          return
        }
        if (fields.id.trim() && !/^#?\d+$/.test(fields.id.trim())) {
          inlineError(
            'history-filter-error',
            '请输入运行编号，例如 #01 或 1。',
            '#history-filters [name="id"]',
          )
          return
        }
        historyFilters = { ...fields, id: fields.id.trim() }
        historyFilterDraft = { ...historyFilters }
        historyPageNumber = 1
        historyError = false
        render()
        announce('历史筛选已更新，不会创建新的评测。')
      })
      document.addEventListener('input', (event) => {
        const target = event.target
        if (target.matches('input,textarea,select')) {
          target.removeAttribute('aria-invalid')
          target.removeAttribute('aria-describedby')
        }
        if (target.closest('#case-editor')) {
          packageChecks.delete(target.closest('#case-editor').getAttribute('data-trace'))
          const publish = content.querySelector('[data-action="publish"]')
          if (publish) publish.disabled = true
        }
      })
      const environmentStudio = createEnvironmentStudio({
        escapeHtml,
        onChange: () => {
          if (page === 'environment') render()
        },
        onBack: () => {
          page = 'traces'
          render(true)
        },
        onUse: (recipe) => {
          if (!findFixture(recipe.id)) fixtureCatalog.push(recipe)
          const draft = drafts.get(recipe.sourceTrace)
          draft.fixture = recipe.id
          packageChecks.delete(recipe.sourceTrace)
          selected = recipe.sourceTrace
          draftSteps.set(selected, 'environment')
          page = 'traces'
          announce(`已保存环境 ${recipe.id} 并回填当前用例。仅为演示版本；正式入库仍需服务端检查。`)
          render(true)
        },
      })
      function openEnvironment(id) {
        const t = getTrace(id)
        if (!t || t.missing || t.kind !== 'code' || t.state === 'published') return
        if (!drafts.has(id)) drafts.set(id, blankDraft(t))
        setGroupState(t, 'editing')
        selected = id
        draftSteps.set(id, 'environment')
        environmentStudio.open(id, drafts.get(id).input)
        notice = ''
        page = 'environment'
        render(true)
      }
      if (location.hash === '#environment') openEnvironment('trace-01')
      else {
        if (location.hash === '#history') evalView = 'history'
        render()
      }
    </script>
  </body>
</html>
